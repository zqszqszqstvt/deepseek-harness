# /etc/uv/uv.toml — uv's system-level config, read-only inside the sandbox.
#
# Deliberately mirror-free: uv resolves from the public index. The two settings
# below are what actually matter in a sandbox, so keep this file even without a
# mirror. To use one, add the commented [[index]] block and point pip.conf at the
# same URL so the two tools do not diverge.

# [[index]]
# url = "https://pypi.tuna.tsinghua.edu.cn/simple"
# default = true

# Hardlinks fail across filesystems (workspace volumes, overlayfs), and a copy
# keeps a .venv self-contained inside the user's workspace.
link-mode = "copy"

# The shared runtime's interpreter is the only one. Project commands do receive
# a writable project-local HOME, but downloading another interpreter would
# duplicate the runtime and weaken version control across projects.
python-downloads = "never"

# Deliberately NOT set here: cache-dir. The Server injects a project-local
# UV_CACHE_DIR under <workspace>/.cache, so no host-global writable cache is
# shared across projects.
