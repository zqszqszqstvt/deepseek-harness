# /etc/pip.conf — optional. Read-only inside the sandbox (/etc is ro-bound), so
# every user's agent picks it up without being told about it.
#
# This file is deliberately mirror-free: agents install from the public index.
# Delete it entirely if you want pip's own defaults — nothing in the kit requires
# it. To use a mirror instead, uncomment the two index lines.
#
# Never put credentials here: an agent can `cat /etc/pip.conf`. A token-bearing
# URL also cannot be moved to the environment as a workaround — variable names
# matching KEY|PASSWORD|SECRET|TOKEN are dropped from the child environment
# (packages/subprocess/subprocess/src/index.ts:44,60-64), so it would silently
# stop applying.
[global]
# index-url = https://pypi.tuna.tsinghua.edu.cn/simple
# trusted-host = pypi.tuna.tsinghua.edu.cn
timeout = 60
disable-pip-version-check = true
no-input = true
