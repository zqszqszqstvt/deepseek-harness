- insert:
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('server-storage')

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json

    - id: directory-picker
      name: '@deepseek-ai/dsh-host-directory-picker-browse'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: server-startup
      name: '@deepseek-ai/dsh-server/startup'

    - id: server-environments
      name: '@deepseek-ai/dsh-server/environments'

    - id: server-environment-context
      name: '@deepseek-ai/dsh-server/environment-context'
      inject: [serverEnvironments]

    - id: tool-server-environment
      name: '@deepseek-ai/dsh-server/tool-environment'
      inject: [serverEnvironments]

    - id: executor-broker
      name: '@deepseek-ai/dsh-server/executor-broker'
      inject: [serverEnvironments]

    - id: server-cloud-execution
      name: cordis:group
      group: true
      isolate:
        fs: true
        subprocess: true
        shell: true
      config:
        - id: cloud-subprocess
          name: '@deepseek-ai/dsh-subprocess-local'
          config:
            inheritParentEnv: false
            baseEnv:
              PATH: /usr/local/bin:/usr/bin:/bin

        - id: cloud-fs
          name: '@deepseek-ai/dsh-fs-sandbox'
          config:
            strictReads: true

        - id: cloud-bash
          name: '@deepseek-ai/dsh-bash-sandbox'
          disabled: !!js process.platform === 'win32'
          config:
            timeoutMs: 60000

        - id: cloud-pwsh
          name: '@deepseek-ai/dsh-pwsh-sandbox'
          disabled: !!js process.platform !== 'win32'

        - id: cloud-execution-bridge
          name: '@deepseek-ai/dsh-server/cloud-execution'

    - id: server-runtime-router
      name: '@deepseek-ai/dsh-server/runtime-router'

    - id: server-spill-store
      name: '@deepseek-ai/dsh-server/spill-store'

    - id: server-fs-router
      name: '@deepseek-ai/dsh-server/fs-router'

    - id: server-subprocess-router
      name: '@deepseek-ai/dsh-server/subprocess-router'

    - id: server-shell-router
      name: '@deepseek-ai/dsh-server/shell-router'
      config:
        maxTimeoutMs: 120000

    - id: tool-server-shell
      name: '@deepseek-ai/dsh-server/tool-shell'
      config:
        backgroundTimeoutMs: 1800000

    - id: api-gateway
      name: '@deepseek-ai/dsh-host-apiproxy'
      config:
        nativeOpen: false

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      inject: [serverStartup]
      config:
        host: !!js ctx.serverStartup.host ?? '127.0.0.1'
        port: !!js ctx.serverStartup.port ?? 3080

    - id: server-runtime
      name: '@deepseek-ai/dsh-server'
      inject: [serverStartup, serverEnvironments]
      config:
        host: !!js ctx.serverStartup.host ?? '127.0.0.1'
        port: !!js ctx.serverStartup.port ?? 3080
        dataDir: !!js ctx.serverStartup.dataDir
        maxConcurrentTurns: !!js ctx.serverStartup.maxConcurrentTurns
        maxSseConnections: !!js ctx.serverStartup.maxSseConnections
        maxSseConnectionsPerUser: !!js ctx.serverStartup.maxSseConnectionsPerUser
        sseClientBufferBytes: !!js ctx.serverStartup.sseClientBufferBytes
        corsOrigin: !!js ctx.serverStartup.corsOrigin

- id: session-persistence-jsonl
  disabled: true

- id: subprocess
  disabled: true

- id: bash-sandbox
  disabled: true

- id: pwsh-sandbox
  disabled: true

- id: fs-sandbox
  disabled: true

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- insert:
    - id: server-session-persistence-jsonl
      name: '@deepseek-ai/dsh-server/session-persistence'

# A Server user can approve other request types, but no approval or persisted
# session mode may widen filesystem access beyond that user's workspace.
- id: sandbox-policy
  config:
    mode: workspace-write
    maximumMode: workspace-write
    escalationTargets: []
    workspaceRoot: !!js process.cwd()

- id: permission
  config:
    defaultPreset: workspace-write
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: workspace-write
        description: Write only inside the session workspace and permitted temporary directories.

- id: sandbox
  config:
    strictFilesystem: true
    runnerCommand:
      - pasta
      - --foreground
      - --quiet
      - --config-net
      - --no-map-gw
      - --dns-forward
      - 192.0.2.53
      - --tcp-ports
      - none
      - --udp-ports
      - none
      - --
      - /usr/local/libexec/dsh-netns-bwrap
    runnerFailureSignatures:
      - 'pasta:'
      - 'dsh-netns-bwrap:'
      - 'bwrap:'

- id: fs-sandbox
  config:
    strictReads: true

# The Server owns spill placement; the generic local provider must not trust a
# model-writable workspace path when performing host-side writes.
- id: spill-local
  disabled: true

# Model-written workflow JavaScript runs outside the multi-user Server process.
# The process sandbox exposes only its runtime, a private /tmp, and no network.
- id: workflow-worker-thread
  config:
    provider: spawn
    execution: sandboxed-process

- id: tool-fs-search
  config:
    sampleOverCapGlobResults: false
    strictReads: true
